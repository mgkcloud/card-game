<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rare Card Shine Test</title>
<style>
body{margin:0;padding:20px;background:#222;color:white;font-family:sans-serif}
.card-container{position:relative;display:inline-block}
.rare-shine{position:absolute;left:0;top:0;pointer-events:none;width:100%;height:100%;}
.card{display:block;width:256px;height:256px}
.controls{margin-top:10px}
</style>
</head>
<body>
<div class="card-container">
  <img class="card" src="./card.png" alt="Card" />
  <canvas class="rare-shine"></canvas>
</div>
<div class="controls">
  Intensity: <input id="intensity" type="range" min="1" max="4" step="0.1" value="1" />
</div>
<script type="module" src="./index.ts"></script>
</body>
</html>
